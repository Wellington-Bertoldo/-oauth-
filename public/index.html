<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laboratório de autenticação</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        background: #f5f7fb;
        color: #1f2937;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }
      .actions {
        display: flex;
        gap: 1rem;
        margin: 1.5rem 0;
        flex-wrap: wrap;
      }
      a, button {
        display: inline-block;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        border: none;
        text-decoration: none;
        background: #2563eb;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #ef4444;
      }
      pre {
        background: #111827;
        color: #e5e7eb;
        padding: 1rem;
        border-radius: 8px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Laboratório de autenticação</h1>
      <p id="status">A sessão ainda não foi consultada.</p>

      <div class="actions">
        <a href="/oauth/login/google">Entrar com Google</a>
        <a href="/oauth/login/github">Entrar com GitHub</a>

        <form id="logout-form" method="post" action="/oauth/logout">
          <button class="secondary" type="submit">Sair</button>
        </form>
      </div>

      <pre id="profile">Carregando perfil…</pre>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
